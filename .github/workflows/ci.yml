name: OnlyCats CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./data/onlycats.db
      JWT_SECRET: onlycats-ci-secret-at-least-32-characters
      FRONTEND_DIST: ../frontend/dist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run build
      - run: npm test
      - name: HTTP smoke against SQLite
        shell: bash
        run: |
          npm run start -w backend > /tmp/onlycats-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /dev/null; then break; fi
            sleep 1
          done
          npm run test:http -w backend || { cat /tmp/onlycats-api.log; exit 1; }
          npm run test:social -w backend || { cat /tmp/onlycats-api.log; exit 1; }
          npm run test:deployment -w backend || { cat /tmp/onlycats-api.log; exit 1; }

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: onlycats
      POSTGRES_USER: onlycats
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U onlycats']
      interval: 5s
      retries: 10
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '8080:3000'
    environment:
      DATABASE_URL: postgresql://onlycats:${POSTGRES_PASSWORD}@postgres:5432/onlycats
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      API_URL: ${API_URL:-/api}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_PLAN_ID: ${PAYPAL_PLAN_ID:-}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
